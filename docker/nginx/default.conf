limit_req_zone $binary_remote_addr zone=mylimit:10m rate=10r/s;
server {
    listen 80;
    listen [::]:80;
    server_name _;

    absolute_redirect off;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;

    location / {
        limit_req zone=mylimit burst=10 nodelay;
        root /web;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Short keys are resolved server-side so non-browser clients (curl, irm) get a
    # real 307 instead of the SPA shell. Unknown keys 404 and fall through to @spa,
    # which is how /admin, /login and friends still reach the React router.
    location ~ ^/([A-Za-z0-9]+)$ {
        limit_req zone=mylimit burst=10 nodelay;
        proxy_pass http://pika-python:8000/api/v4/go/$1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_intercept_errors on;
        error_page 404 = @spa;
    }

    location @spa {
        root /web;
        try_files /index.html =404;
    }

    # ^~ so the prefix beats the short-key regex above for /api itself
    location ^~ /api {
        limit_req zone=mylimit burst=10 nodelay;
        proxy_pass http://pika-python:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

    }
}
